services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      ENVIRONMENT: production
      APP_PHASE: production-polish
      DATABASE_URL: postgresql+psycopg://revenuerescue:revenuerescue@postgres:5432/revenuerescue
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: revenuerescue
      POSTGRES_USER: revenuerescue
      POSTGRES_PASSWORD: revenuerescue
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenuerescue -d revenuerescue"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
