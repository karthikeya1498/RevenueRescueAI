name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Lint
        run: ruff check backend/app backend/tests backend/migrations backend/scripts
      - name: Migration smoke test
        run: |
          rm -f /tmp/revenuerescue-ci.db
          DATABASE_URL=sqlite:////tmp/revenuerescue-ci.db alembic upgrade head
          DATABASE_URL=sqlite:////tmp/revenuerescue-ci.db alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --omit=dev
      - run: npm run build
